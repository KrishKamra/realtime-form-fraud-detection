name: CI Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Python Engine Quality & Unit Tests (apps/api)
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Engine Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd apps/api
          uv sync --frozen

      - name: Run Ruff Lint Check
        run: |
          cd apps/api
          uvx ruff check .

      - name: Run Ruff Format Check
        run: |
          cd apps/api
          uvx ruff format . --check

      - name: Run Pytest Test Suite
        run: |
          cd apps/api
          uv run pytest

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Web Application Checks (apps/web)
  # ---------------------------------------------------------------------------
  web-checks:
    name: Next.js Frontend Quality & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # 👈 Explicitly specifies pnpm version for action-setup@v4

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm --filter web typecheck

      - name: Run ESLint
        run: pnpm --filter web lint