name: CI Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Python Engine Quality & Unit Tests (apps/api)
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Engine Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run Ruff Lint Check
        working-directory: apps/api
        run: uv run ruff check .

      - name: Run Ruff Format Check
        working-directory: apps/api
        run: uv run ruff format . --check

      - name: Run Pytest Test Suite
        working-directory: apps/api
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Web Application Checks (apps/web)
  # ---------------------------------------------------------------------------
  web-checks:
    name: Next.js Frontend Quality & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV
          echo "store_path=$STORE_PATH" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm --filter web typecheck

      - name: Run ESLint
        run: pnpm --filter web lint