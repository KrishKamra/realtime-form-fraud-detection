apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-api
  namespace: default
  labels:
    app.kubernetes.io/name: sentry-api
    app.kubernetes.io/part-of: sentryform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sentry-api
  template:
    metadata:
      labels:
        app: sentry-api
    spec:
      containers:
        - name: api
          image: sentryform/api:v1.0.0
          imagePullPolicy: IFNotPresent
          ports:
            - containerPort: 8000
              name: http-ws
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: MODEL_PATH
              value: "models/sentry_lgbm.onnx"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentry-web
  namespace: default
  labels:
    app.kubernetes.io/name: sentry-web
    app.kubernetes.io/part-of: sentryform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sentry-web
  template:
    metadata:
      labels:
        app: sentry-web
    spec:
      containers:
        - name: web
          image: sentryform/web:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://sentryform.io/ws/telemetry"
            - name: NEXT_PUBLIC_API_URL
              value: "https://sentryform.io"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10