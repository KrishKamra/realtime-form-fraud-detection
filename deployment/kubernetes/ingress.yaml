apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentryform-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # WebSocket proxy support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentry-api-service"
    # CORS setup for web client streaming
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
    - host: sentryform.io
      http:
        paths:
          # Next.js Web App
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentry-web-service
                port:
                  number: 3000
          # FastAPI REST Endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sentry-api-service
                port:
                  number: 8000
          # WebSocket Telemetry Channel
          - path: /ws/telemetry
            pathType: Prefix
            backend:
              service:
                name: sentry-api-service
                port:
                  number: 8000